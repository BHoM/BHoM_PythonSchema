name: PR checks

on:
  pull_request:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: windows-latest
    env:
      # Real-type tests fail instead of being skipped when an assembly is missing
      CI: 'true'
      PYTHONPATH: ${{ github.workspace }}/.ci/generation
      BHOM_JSONSCHEMA_ROOT: ${{ github.workspace }}\.repos\BHoM_JSONSchema

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml

      # The built assemblies only change when one of the cloned repositories does, so they are cached under the current commit of each
      # repository (the same branch choice as Clone-Repositories.ps1). A new commit anywhere gives a new key, so the cache is never stale.
      - name: Find the current commit of each repository
        id: commits
        shell: pwsh
        run: |
          $lines = foreach ($repository in (Get-Content Included-repositories.txt | ForEach-Object { $_.Trim() } | Where-Object { $_ -ne "" -and -not $_.StartsWith("#") })) {
            $commit = ""
            foreach ($branch in "develop", "main", "master") {
              $found = git ls-remote "https://github.com/$repository.git" "refs/heads/$branch"
              if ($found) { $commit = ($found -split "\s+")[0]; break }
            }

            if (-not $commit) { throw "Could not find a develop, main or master branch of $repository" }
            "$repository $commit"
          }

          $text = $lines -join "`n"
          Write-Host $text
          $hash = [System.BitConverter]::ToString([System.Security.Cryptography.SHA256]::Create().ComputeHash([System.Text.Encoding]::UTF8.GetBytes($text))).Replace("-", "").ToLower()
          "key=bhom-assemblies-v1-$hash" >> $env:GITHUB_OUTPUT

      - name: Restore the built BHoM assemblies
        id: assemblies
        uses: actions/cache/restore@v4
        with:
          path: C:\ProgramData\BHoM\Assemblies
          key: ${{ steps.commits.outputs.key }}

      - uses: microsoft/setup-msbuild@v2
        if: steps.assemblies.outputs.cache-hit != 'true'

      - uses: NuGet/setup-nuget@v2
        if: steps.assemblies.outputs.cache-hit != 'true'

      - name: Clone the repositories
        if: steps.assemblies.outputs.cache-hit != 'true'
        shell: pwsh
        run: ./.github/scripts/Clone-Repositories.ps1 -List Included-repositories.txt

      - name: Build the repositories in dependency order
        if: steps.assemblies.outputs.cache-hit != 'true'
        shell: pwsh
        run: ./.github/scripts/Build-Repositories.ps1 -List Included-repositories.txt

      # Saved right after the build, so a failure later in the job does not lose it
      - name: Save the built BHoM assemblies
        if: steps.assemblies.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: C:\ProgramData\BHoM\Assemblies
          key: ${{ steps.commits.outputs.key }}

      # The published JSON schemas are the test oracle for the JSON that Python writes. Read only; the generator does not use them.
      - name: Clone BHoM_JSONSchema (test oracle)
        shell: pwsh
        run: git clone https://github.com/BHoM/BHoM_JSONSchema.git .repos/BHoM_JSONSchema --depth 1 --quiet

      - name: Create the virtual environment
        shell: pwsh
        run: |
          python -m venv .venv
          .venv\Scripts\python -m pip install -e ".[dev]"

      # Build, NUnit, py2cs drafts and the Roslyn round trip, pytest, and Pyright
      - name: Build and test
        shell: pwsh
        run: ./.ci/unit-tests/run-all.ps1

      - name: Does the Python PR change the classes?
        id: changed
        shell: pwsh
        if: github.event_name == 'pull_request'
        run: |
          $base = "${{ github.event.pull_request.base.sha }}"
          $changed = git diff --name-only $base HEAD -- src/bhom_schema
          "classes=$([bool]$changed)".ToLower() | Out-File $env:GITHUB_OUTPUT -Append

      - name: Get the classes before the change
        if: steps.changed.outputs.classes == 'true'
        shell: pwsh
        run: git worktree add "$env:RUNNER_TEMP/base" ${{ github.event.pull_request.base.sha }}

      - name: py2cs check (every problem of the changed Python, descriptions)
        if: steps.changed.outputs.classes == 'true'
        shell: pwsh
        run: .venv\Scripts\python -m py2cs check --root src/bhom_schema --base-root "$env:RUNNER_TEMP/base/src/bhom_schema"

      # The Python PR is a proposal: it only passes once the linked C# PR is merged, because the clones above are the C# develop branches.
      # After the C# PR is merged, re-run this workflow.
      - name: py2cs align (fails until the linked C# PR is merged)
        if: steps.changed.outputs.classes == 'true'
        shell: pwsh
        run: |
          .venv\Scripts\python -m py2cs align `
            --base-root "$env:RUNNER_TEMP/base/src/bhom_schema" `
            --head-root src/bhom_schema `
            --assemblies "$env:ProgramData\BHoM\Assemblies"

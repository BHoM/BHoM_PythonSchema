name: Linked C# pull request (hourly status)

# Every hour: has the C# pull request of an open Python PR been merged (or closed) since? Nothing tells this repository when that happens.
# This only reads the C# repositories, which must be public, and writes the commit status "linked C# pull request" on this repository.
# A schedule only, so nothing of it shows on a pull request.

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sweep:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    steps:
      # The default branch, so the tooling is the trusted one
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Update the status of every open Python PR that changes the classes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONPATH: .ci/generation
          PY2CS_PYTHON_TOKEN: ${{ github.token }}
        run: |
          gh pr list --state open --limit 100 --json number,headRefOid,headRepositoryOwner,files \
            --jq '.[] | select(.headRepositoryOwner.login == "${{ github.repository_owner }}") | select(any(.files[]; .path | startswith("src/bhom_schema/"))) | "\(.number) \(.headRefOid)"' |
          while read -r number sha; do
            echo "Python PR #$number"
            python -m py2cs status --python-repo "${{ github.repository }}" --python-pr "$number" --sha "$sha" --repos-file Converted-repositories.txt
          done

name: Built BHoM assemblies
description: >
  Installs the built assemblies of the repositories in Included-repositories.txt into C:\ProgramData\BHoM\Assemblies, from a cache when none of them
  has a new commit, otherwise by cloning and building them (and saving the cache).

runs:
  using: composite
  steps:
    # The built assemblies only change when one of the cloned repositories does, so they are cached under the current commit of each
    # repository (the same branch choice as Clone-Repositories.ps1). A new commit anywhere gives a new key, so the cache is never stale.
    - name: Find the current commit of each repository
      id: commits
      shell: pwsh
      run: |
        $lines = foreach ($repository in (Get-Content Included-repositories.txt | ForEach-Object { $_.Trim() } | Where-Object { $_ -ne "" -and -not $_.StartsWith("#") })) {
          $commit = ""
          foreach ($branch in "develop", "main", "master") {
            $found = git ls-remote "https://github.com/$repository.git" "refs/heads/$branch"
            if ($found) { $commit = ($found -split "\s+")[0]; break }
          }

          if (-not $commit) { throw "Could not find a develop, main or master branch of $repository" }
          "$repository $commit"
        }

        $text = $lines -join "`n"
        Write-Host $text
        $hash = [System.BitConverter]::ToString([System.Security.Cryptography.SHA256]::Create().ComputeHash([System.Text.Encoding]::UTF8.GetBytes($text))).Replace("-", "").ToLower()
        "key=bhom-assemblies-v1-$hash" >> $env:GITHUB_OUTPUT

    - name: Restore the built BHoM assemblies
      id: assemblies
      uses: actions/cache/restore@v4
      with:
        path: C:\ProgramData\BHoM\Assemblies
        key: ${{ steps.commits.outputs.key }}

    - uses: microsoft/setup-msbuild@v2
      if: steps.assemblies.outputs.cache-hit != 'true'

    - uses: NuGet/setup-nuget@v2
      if: steps.assemblies.outputs.cache-hit != 'true'

    - name: Clone the repositories
      if: steps.assemblies.outputs.cache-hit != 'true'
      shell: pwsh
      run: ./.github/scripts/Clone-Repositories.ps1 -List Included-repositories.txt

    - name: Build the repositories in dependency order
      if: steps.assemblies.outputs.cache-hit != 'true'
      shell: pwsh
      run: ./.github/scripts/Build-Repositories.ps1 -List Included-repositories.txt

    # Saved right after the build, so a failure later in the job does not lose it
    - name: Save the built BHoM assemblies
      if: steps.assemblies.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: C:\ProgramData\BHoM\Assemblies
        key: ${{ steps.commits.outputs.key }}

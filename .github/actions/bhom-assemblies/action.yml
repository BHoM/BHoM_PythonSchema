name: Built BHoM assemblies
description: >
  Installs the built assemblies of the repositories in Included-repositories.txt into C:\ProgramData\BHoM, building only the repositories whose
  commit, or whose dependencies' commits, changed since the build cache was saved.

inputs:
  no-cache:
    description: Ignore the build cache and build every repository
    default: 'false'

outputs:
  built:
    description: The names of the repositories that were built, separated by commas (empty when all came from the cache)
    value: ${{ steps.build.outputs.built }}

runs:
  using: composite
  steps:
    # Before the plan, because the MSBuild version is part of the keys
    - uses: microsoft/setup-msbuild@v2

    - uses: NuGet/setup-nuget@v2

    # The current commit and dependencies of each repository give it a key; the plan is saved so the build uses the same commits
    - name: Plan the build
      id: plan
      shell: pwsh
      run: ./.github/scripts/Build-Repositories.ps1 -List Included-repositories.txt -Plan -PlanFile "$env:RUNNER_TEMP/build-plan.json"

    # The exact key means nothing changed; otherwise the most recent folder gives the entries that are still current
    - name: Restore the build cache
      if: inputs.no-cache != 'true'
      uses: actions/cache/restore@v4
      with:
        path: .build-cache
        key: ${{ steps.plan.outputs.key }}
        restore-keys: ${{ steps.plan.outputs.prefix }}

    - name: Build the repositories in dependency order
      id: build
      shell: pwsh
      env:
        NO_CACHE: ${{ inputs.no-cache }}
      run: |
        $arguments = @{ List = "Included-repositories.txt"; PlanFile = "$env:RUNNER_TEMP/build-plan.json"; CacheFolder = ".build-cache" }
        if ($env:NO_CACHE -eq "true") { $arguments.NoCache = $true }

        ./.github/scripts/Build-Repositories.ps1 @arguments

    # Saved right after the build, so a failure later in the job does not lose it
    - name: Save the build cache
      if: steps.build.outputs.added != ''
      uses: actions/cache/save@v4
      with:
        path: .build-cache
        key: ${{ steps.plan.outputs.key }}

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bhom-schema"
dynamic = ["version"]
description = "Python classes generated from the BHoM C# object model (oM)."
requires-python = ">=3.12"
license = { file = "LICENSE" }
dependencies = ["pydantic>=2.13,<3"]

[project.optional-dependencies]
dev = ["pytest>=8", "pyright==1.1.414", "pyyaml>=6", "types-PyYAML", "jsonschema>=4.18", "types-jsonschema"]

[tool.setuptools.dynamic]
version = { attr = "bhom_schema._version.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", ".ci/generation", ".ci/unit-tests/python"]
testpaths = [".ci/unit-tests/python"]
addopts = "-ra"
markers = ["realtypes: needs the real BHoM assemblies installed"]
